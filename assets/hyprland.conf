# The temporary nested output has a fixed 1280x720 mode. Final geometry is
# applied to the headless output after the nested output has been removed.
monitor = , 1280x720@60, auto, 1

xwayland {
    enabled = true
}
debug {
    disable_logs = false
}
animations {
    enabled = false
}
general {
    border_size = 0
    gaps_in = 0
    gaps_out = 0
}
decoration {
    rounding = 0
    shadow {
        enabled = false
    }
    blur {
        enabled = false
    }
}
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    # AWL owns supervision and never launches unconfined desktop dialogs.
    disable_watchdog_warning = true
    disable_hyprland_guiutils_check = true
    enable_anr_dialog = false
}
ecosystem {
    no_update_news = true
    no_donation_nag = true
}
