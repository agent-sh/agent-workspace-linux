version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # Both crates come from one zed commit and only build together.
      gpui:
        patterns:
          - gpui
          - gpui_platform
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      codeql-action:
        patterns:
          - github/codeql-action*
