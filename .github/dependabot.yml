version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      # zbus 6 removes our blocking API and does not migrate GPUI's zbus 5
      # consumers. Upgrade it with the complete D-Bus migration in #135.
      - dependency-name: zbus
        update-types:
          - version-update:semver-major
    groups:
      # Both crates come from one zed commit and only build together.
      gpui:
        patterns:
          - gpui
          - gpui_platform
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      codeql-action:
        patterns:
          - github/codeql-action*
